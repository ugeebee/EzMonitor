# EzMonitor stack.
#   First time:   cp .env.example .env   (then set passwords)
#   DB only:      docker compose up -d                 -> db + migrate + db-maint
#   Dev data:     docker compose --profile seed run --rm seed
#   Full stack:   docker compose --profile app up -d   (once backend/frontend have Dockerfiles)
#   Reset DB:     docker compose down -v               (deletes the pgdata volume)
name: ezmonitor

x-db-env: &db-env
  PGHOST: db
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-ezm_owner}
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  PGDATABASE: ${POSTGRES_DB:-ezmonitor}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezm_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ezmonitor}
      EZM_INGEST_PASSWORD: ${EZM_INGEST_PASSWORD:?set EZM_INGEST_PASSWORD in .env}
      EZM_API_PASSWORD: ${EZM_API_PASSWORD:?set EZM_API_PASSWORD in .env}
      EZM_READONLY_PASSWORD: ${EZM_READONLY_PASSWORD:?set EZM_READONLY_PASSWORD in .env}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=500   # log queries slower than 500 ms
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # runs ONLY on an empty volume
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"          # localhost only, for running Go/psql on the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies db/migrations/* in order, records progress in schema_migrations, exits.
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-ezm_owner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ezmonitor}?sslmode=disable
      - up
    restart: "no"

  # Hourly: pre-create metrics partitions (yesterday..+7 days) and drop expired ones.
  db-maint:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          psql -X -q -t -v ON_ERROR_STOP=1 -c "SELECT now(), run_maintenance($$RETENTION_DAYS)" \
            || echo "db-maint: maintenance FAILED"
          sleep 3600
        done

  # Dev fixtures + 7 days of synthetic metrics. Opt-in only.
  seed:
    image: postgres:16
    profiles: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *db-env
    volumes:
      - ./db/seed:/seed:ro
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/seed/dev_seed.sql", "-f", "/seed/backfill_metrics.sql"]
    restart: "no"

  # ---- application tier (needs backend/Dockerfile and frontend/) ----
  backend:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      INGEST_DATABASE_URL: postgres://ezm_ingest:${EZM_INGEST_PASSWORD}@db:5432/${POSTGRES_DB:-ezmonitor}?sslmode=disable
      API_DATABASE_URL: postgres://ezm_api:${EZM_API_PASSWORD}@db:5432/${POSTGRES_DB:-ezmonitor}?sslmode=disable
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"      # agents post here directly in dev (http://<host>:8080/api/v1/ingest)

  caddy:
    image: caddy:2
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      EZM_DOMAIN: ${EZM_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
